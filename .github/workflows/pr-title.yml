name: PR title

# Le squash merge reprend le titre de PR comme sujet de commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            test
            docs
            build
            ci
          # Dependabot n'a pas de numéro d'issue : ses PR portent ce label.
          ignoreLabels: dependencies
          subjectPattern: ^.+ \(#\d+\)$
          subjectPatternError: 'Le sujet doit finir par le numéro d’issue : "type(scope): subject (#12)".'
