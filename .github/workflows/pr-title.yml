name: PR title

# Le squash merge d'une PR à plusieurs commits reprend son titre comme sujet de commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    # Dependabot n'a pas de numéro d'issue. L'auteur de la PR, pas l'acteur : un push humain sur sa branche relancerait le check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            test
            docs
            build
            ci
          # Issue du dépôt ou d'un autre (`prepalist_api#57`, `KylianGERMAIN/prepalist_api#57`), ou release `chore(release): vX.Y.Z`.
          subjectPattern: ^(?:.+ \((?:[\w./-]+)?#\d+\)|v\d+\.\d+\.\d+)$
          subjectPatternError: 'Le sujet doit finir par le numéro d’issue : "type(scope): subject (#12)".'
