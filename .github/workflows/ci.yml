name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prepalist
          POSTGRES_PASSWORD: prepalist
          POSTGRES_DB: prepalist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prepalist -d prepalist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ci

      - run: pnpm test

      # La base de test est créée et migrée par test/global-setup.ts.
      - run: pnpm test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: prepalist
          DB_PASSWORD: prepalist

      - run: pnpm build
