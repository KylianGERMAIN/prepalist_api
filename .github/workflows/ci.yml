name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prepalist
          POSTGRES_PASSWORD: prepalist
          POSTGRES_DB: prepalist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prepalist -d prepalist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: prepalist
      DB_PASSWORD: prepalist

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ci

      - run: pnpm test:cov

      # La base de test est créée et migrée par test/global-setup.ts.
      - run: pnpm test:e2e

      - name: Schema drift (entities vs migrations)
        env:
          DB_NAME: prepalist
        run: |
          pnpm migration:run
          pnpm migration:generate --check src/migrations/Check

      - name: OpenAPI contract is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json || { echo "::error::openapi.json est périmé : lancer pnpm openapi:export et commiter."; exit 1; }

      - run: pnpm build
